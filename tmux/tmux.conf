set -g default-terminal "screen-256color"
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g default-shell /bin/zsh

# Nice to have config
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'xamut/tmux-weather'

# Nice to have
set -g @plugin 'tmux-plugins/tmux-yank'

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Theme config
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "basic"

run ~/.config/tmux/plugins/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_middle_separator "█ "
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator " "

set -g status-bg default
set -g status-style bg=default

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# decide whether we're in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Floating hdev dashboard, toggle-term style. The popup only *attaches* to a
# detached session, so hiding it detaches the client and hdev keeps running.
# Same key inside the popup dismisses it — a popup is a client on this same
# server, so the root-table binding is live in both places.
hdev_popup="tmux has-session -t '=hdev' 2>/dev/null || { \
    tmux new-session -d -s hdev -x 200 -y 50 \
        -c /Users/m8rmclaren/coding/dev/chartport/hermes \
        /Users/m8rmclaren/coding/dev/chartport/hermes/scripts/hdev; \
    tmux set -t hdev status off; }; \
    tmux attach -t '=hdev'"

bind -n M-h if-shell -F '#{==:#{session_name},hdev}' \
    'detach-client' \
    "display-popup -w 90% -h 90% -b rounded -T ' hdev ' -E \"$hdev_popup\""

# Same thing behind the prefix, for terminals not sending Meta on Option.
bind h if-shell -F '#{==:#{session_name},hdev}' \
    'detach-client' \
    "display-popup -w 90% -h 90% -b rounded -T ' hdev ' -E \"$hdev_popup\""

# Floating scratch terminal, same toggle-term trick as hdev above but a plain
# shell instead of a fixed command, for whatever quick thing comes up.
# Overrides tmux's default M-t (clock-mode) binding on purpose.
scratch_popup="tmux has-session -t '=scratch' 2>/dev/null || { \
    tmux new-session -d -s scratch -x 200 -y 50; \
    tmux set -t scratch status off; }; \
    tmux attach -t '=scratch'"

bind -n M-t if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    "display-popup -w 90% -h 90% -b rounded -T ' scratch ' -E \"$scratch_popup\""

# Same thing behind the prefix, for terminals not sending Meta on Option.
bind t if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    "display-popup -w 90% -h 90% -b rounded -T ' scratch ' -E \"$scratch_popup\""

# Escape dismisses the scratch popup instead of reaching the shell inside it.
# Global root-table bind, but the -F check costs no fork, and copy-mode's own
# Escape binding still wins there, so this only ever fires at the scratch
# session's shell prompt; everywhere else Escape is forwarded as normal.
bind -n Escape if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    'send-keys Escape'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
